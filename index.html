<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05030f" />
  <meta name="description" content="MoodWave: a binaural-beat mood synthesizer with a retro neon visualizer." />
  <title>MoodWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Orbitron", "sans-serif"],
            mono: ['"Share Tech Mono"', "ui-monospace", "monospace"],
          },
        },
      },
    };
  </script>
  <style>
    html, body { background: #05030f; }
    .skin {
      background: linear-gradient(160deg, #2b3049 0%, #151829 42%, #0a0c17 100%);
    }
    .scanlines {
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
      mix-blend-mode: multiply;
    }
    input[type="range"].vol {
      -webkit-appearance: none; appearance: none;
      height: 6px; border-radius: 999px; outline: none; cursor: pointer;
      background: linear-gradient(90deg, var(--accent) var(--pct), rgba(255,255,255,0.12) var(--pct));
    }
    input[type="range"].vol::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 12px var(--accent);
    }
    input[type="range"].vol::-moz-range-thumb {
      width: 18px; height: 18px; border: 0; border-radius: 50%;
      background: #fff; box-shadow: 0 0 12px var(--accent);
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-ping { animation: none; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#05030f] text-white antialiased">
  <div id="root"></div>
  <noscript>MoodWave needs JavaScript enabled.</noscript>

  <script type="module">
    import React, { useState, useEffect, useRef, useCallback } from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
    import htm from "https://esm.sh/htm@3.1.1";

    const html = htm.bind(React.createElement);

    /* =====================================================================
       MOOD DEFINITIONS
       left/right = binaural carrier pair (Hz). audio = synth layer settings.
       ===================================================================== */
    const MOOD_ORDER = ["sleep", "relax", "study", "amp", "intimate"];

    /* All music is tuned to the binaural carrier: D3 (MIDI 50) = exactly 150 Hz,
       so the chords and the left-ear tone never rub against each other. */
    const hz = (midi) => 150 * Math.pow(2, (midi - 50) / 12);
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const D_PENT = [62, 64, 66, 69, 71]; // D major pentatonic
    const F_PENT = [65, 67, 69, 72, 74]; // F major pentatonic

    /* Each mood's tempo is locked to its binaural beat: one musical beat lasts a
       whole number of beat-cycles (bpm = beat Hz × 60 ÷ div). The music bus also
       swells gently at the beat frequency itself ("trem"), so the brainwave rhythm
       is felt in the music, not just in the raw tones. Patterns run on a
       16-step-per-bar grid; s = step in bar, t = exact audio-clock time. */
    const MOODS = {
      sleep: {
        label: "Sleep", band: "Delta", beat: 3, left: 150, right: 153,
        tagline: "Slow indigo drift",
        gradient: "from-indigo-950 via-violet-900 to-purple-700",
        glow: "#8b5cf6", accent: "#a78bfa",
        audio: {
          tone: 0.08, chord: [38, 45, 50, 53], padType: "sine",
          pad: 0.08, cutoff: 420, sweepRate: 0.03, sweepDepth: 120,
          noise: 0.05, noiseCutoff: 600,
        },
        music: {
          div: 4, swing: 0, barsPerChord: 2, trem: 0.3, reverb: 0.6,
          prog: [
            { root: 38, notes: [50, 53, 57] }, // Dm
            { root: 34, notes: [50, 53, 58] }, // Bb
            { root: 41, notes: [48, 53, 57] }, // F
            { root: 36, notes: [48, 52, 55] }, // C
          ],
          pattern(I, { s, t, chord, first, beat }) {
            if (first) {
              I.bass(hz(chord.root), t, 0.14, beat * 8, "sine");
              chord.notes.forEach((n, k) => I.keys(hz(n + 12), t + k * 0.12, 0.04, 7));
            }
            if (s % 4 === 0 && Math.random() < 0.42) {
              I.bell(hz(pick(chord.notes) + pick([12, 24])), t, 0.09 + Math.random() * 0.05, 5);
            }
          },
        },
      },
      relax: {
        label: "Relax", band: "Theta", beat: 6, left: 150, right: 156,
        tagline: "Tidal teal flow",
        gradient: "from-teal-950 via-cyan-800 to-sky-600",
        glow: "#22d3ee", accent: "#67e8f9",
        audio: {
          tone: 0.08, chord: [38, 45, 54, 61], padType: "triangle",
          pad: 0.06, cutoff: 850, sweepRate: 0.05, sweepDepth: 300,
          noise: 0.035, noiseCutoff: 1200,
        },
        music: {
          div: 6, swing: 0, barsPerChord: 2, trem: 0.2, reverb: 0.45,
          prog: [
            { root: 38, notes: [50, 54, 57, 61] }, // Dmaj7
            { root: 35, notes: [50, 54, 57, 59] }, // Bm7
            { root: 43, notes: [50, 54, 55, 59] }, // Gmaj7
            { root: 45, notes: [49, 52, 54, 57] }, // A6
          ],
          pattern(I, { i, s, t, chord, first, beat }) {
            if (first) chord.notes.forEach((n, k) => I.keys(hz(n + 12), t + k * 0.05, 0.06, 6));
            if (s === 0 || s === 8) I.bass(hz(chord.root), t, 0.13, beat * 2.2, "triangle");
            if (s % 2 === 0 && Math.random() < 0.6) {
              const run = [...chord.notes, ...chord.notes.map((n) => n + 12)];
              I.bell(hz(run[(i / 2) % run.length] + 12), t, 0.06, 2.2);
            }
            if (s % 4 === 2) I.hat(t, 0.012, 0.05);
          },
        },
      },
      study: {
        label: "Study", band: "Alpha", beat: 12, left: 150, right: 162,
        tagline: "Clear green focus",
        gradient: "from-emerald-950 via-green-800 to-lime-600",
        glow: "#34d399", accent: "#6ee7b7",
        audio: {
          tone: 0.075, chord: [38, 45, 52, 57], padType: "triangle",
          pad: 0.045, cutoff: 1100, sweepRate: 0.08, sweepDepth: 250,
          noise: 0.025, noiseCutoff: 2500,
        },
        music: {
          div: 8, swing: 0.18, barsPerChord: 1, trem: 0.1, reverb: 0.25,
          prog: [
            { root: 38, notes: [54, 57, 61, 64] }, // Dmaj9
            { root: 35, notes: [50, 54, 57, 61] }, // Bm9
            { root: 40, notes: [55, 59, 62, 66] }, // Em9
            { root: 33, notes: [55, 59, 61, 66] }, // A13
          ],
          pattern(I, { s, t, chord, beat }) {
            if (s === 0 || s === 10) I.kick(t, 0.2);
            if (s === 4 || s === 12) I.snare(t, 0.07);
            if (s % 2 === 0) I.hat(t, s % 4 === 2 ? 0.03 : 0.018, 0.035);
            if (s === 0) chord.notes.forEach((n) => I.keys(hz(n), t, 0.06, beat * 1.6));
            if (s === 6) chord.notes.forEach((n) => I.keys(hz(n), t, 0.028, beat * 0.9));
            if (s === 0) I.bass(hz(chord.root), t, 0.14, beat * 1.4);
            if (s === 10) I.bass(hz(chord.root), t, 0.11, beat * 0.8);
            if (s === 14) I.bass(hz(chord.root + 7), t, 0.08, beat * 0.4);
            if (s % 2 === 0 && Math.random() < 0.18) I.bell(hz(pick(D_PENT) + 12), t, 0.028, 1.6);
          },
        },
      },
      amp: {
        label: "Amp Up", band: "Gamma", beat: 35, left: 150, right: 185,
        tagline: "Molten high voltage",
        gradient: "from-red-950 via-orange-700 to-amber-500",
        glow: "#f97316", accent: "#fdba74",
        audio: {
          tone: 0.075, chord: [38, 45, 50, 57], padType: "sawtooth",
          pad: 0.04, cutoff: 1600, sweepRate: 0.25, sweepDepth: 900,
          noise: 0.02, noiseCutoff: 4000,
          duck: true, // the pad "pumps" out of the way of each kick
        },
        music: {
          div: 16, swing: 0, barsPerChord: 1, trem: 0, reverb: 0.2,
          prog: [
            { root: 38, notes: [62, 65, 69] }, // Dm
            { root: 34, notes: [62, 65, 70] }, // Bb
            { root: 41, notes: [60, 65, 69] }, // F
            { root: 36, notes: [60, 64, 67] }, // C
          ],
          pattern(I, { i, s, t, chord, duck }) {
            if (s % 4 === 0) { I.kick(t, 0.26); duck(t); }
            if (s === 4 || s === 12) I.snare(t, 0.12);
            I.hat(t, s % 4 === 2 ? 0.05 : 0.018, s % 4 === 2 ? 0.09 : 0.03);
            if (s % 2 === 0) I.pluck(hz(chord.root + (s % 4 === 2 ? 12 : 0)), t, 0.07, 0.16, 500);
            const n = chord.notes[[0, 1, 2, 1][s % 4]] + (i % 8 >= 4 ? 12 : 0);
            I.pluck(hz(n), t, 0.035, 0.12, 2200);
          },
        },
      },
      intimate: {
        label: "Intimate", band: "Schumann", beat: 7.83, left: 150, right: 157.83,
        tagline: "Magenta & gold bloom",
        gradient: "from-fuchsia-950 via-pink-700 to-amber-400",
        glow: "#ec4899", accent: "#f9a8d4",
        audio: {
          tone: 0.075, chord: [41, 48, 52, 57], padType: "triangle",
          pad: 0.055, cutoff: 750, sweepRate: 0.04, sweepDepth: 220,
          noise: 0.03, noiseCutoff: 900,
          // 528 Hz anchor + 264 Hz sub-harmonic, each amplitude-swelled by a slow LFO
          anchor: { freq: 528, level: 0.03, rate: 0.07 },
        },
        music: {
          div: 6, swing: 0.22, barsPerChord: 1, trem: 0.18, reverb: 0.4,
          prog: [
            { root: 41, notes: [57, 60, 64, 65] }, // Fmaj7
            { root: 40, notes: [55, 59, 62, 64] }, // Em7
            { root: 38, notes: [53, 57, 60, 64] }, // Dm9
            { root: 36, notes: [55, 59, 60, 64] }, // Cmaj7
          ],
          pattern(I, { s, t, chord, beat }) {
            if (s === 0 || s === 7 || s === 10) I.kick(t, s === 0 ? 0.24 : 0.16);
            if (s === 4 || s === 12) I.rim(t, 0.06);
            if (s % 2 === 0) I.hat(t, 0.016, 0.03);
            if (s === 0) chord.notes.forEach((n, k) => I.keys(hz(n), t + k * 0.035, 0.05, beat * 3));
            if (s === 10) chord.notes.slice(1).forEach((n) => I.keys(hz(n), t, 0.025, beat * 1.2));
            if (s === 0) I.bass(hz(chord.root), t, 0.15, beat * 1.6);
            if (s === 7) I.bass(hz(chord.root), t, 0.1, beat * 0.7);
            if (s === 10) I.bass(hz(chord.root + 7), t, 0.11, beat * 1.2);
            if (s % 2 === 0 && Math.random() < 0.16) I.bell(hz(pick(F_PENT) + 12), t, 0.025, 2.4);
          },
        },
      },
    };
    MOOD_ORDER.forEach((id) => {
      const m = MOODS[id].music;
      m.bpm = (MOODS[id].beat * 60) / m.div;
    });

    /* =====================================================================
       AUDIO ENGINE (native Web Audio API)
       voice → mix → analyser → master(volume) → limiter → speakers
       ===================================================================== */
    const FADE = 2.5; // seconds for mood crossfades
    const volCurve = (v) => v * v; // perceptual volume curve

    function makePinkNoise(ctx, seconds) {
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1; // Paul Kellet's pink filter
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.969 * b2 + w * 0.153852;
        b3 = 0.8665 * b3 + w * 0.3104856;
        b4 = 0.55 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.016898;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
      return buf;
    }

    function makeWhiteNoise(ctx, seconds) {
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }

    // Stereo reverb impulse: decaying noise, slightly different in each ear.
    function makeImpulse(ctx, seconds, decay) {
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return buf;
    }

    /* Synthesized instruments. Each call schedules one short-lived note at an
       exact audio-clock time; nodes stop and get garbage-collected on their own. */
    function makeInstruments(ctx, dest, white) {
      const envelope = (t, vel, attack, dur) => {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(Math.max(vel, 0.0002), t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        g.connect(dest);
        return g;
      };
      const run = (src, t, dur) => { src.start(t); src.stop(t + dur + 0.05); };
      const tone = (type, f) => {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = f;
        return o;
      };
      const filter = (type, f, q = 0.7) => {
        const b = ctx.createBiquadFilter();
        b.type = type;
        b.frequency.value = f;
        b.Q.value = q;
        return b;
      };
      const noise = (t, dur) => {
        const n = ctx.createBufferSource();
        n.buffer = white;
        n.start(t, Math.random() * (white.duration - 0.5));
        n.stop(t + dur + 0.05);
        return n;
      };

      return {
        // Glassy bell: sine plus a quiet inharmonic partial.
        bell(f, t, vel, dur = 3) {
          const g = envelope(t, vel, 0.005, dur);
          const a = tone("sine", f);
          const b = tone("sine", f * 2.756);
          const bg = ctx.createGain();
          bg.gain.value = 0.15;
          a.connect(g);
          b.connect(bg).connect(g);
          run(a, t, dur);
          run(b, t, dur);
        },
        // Electric piano: two-operator FM with a fast-decaying brightness.
        keys(f, t, vel, dur = 1.5) {
          const g = envelope(t, vel, 0.006, dur);
          const lp = filter("lowpass", 2400);
          lp.connect(g);
          const car = tone("sine", f);
          const mod = tone("sine", f);
          const idx = ctx.createGain();
          idx.gain.setValueAtTime(f * 1.2, t);
          idx.gain.exponentialRampToValueAtTime(f * 0.05, t + 0.6);
          mod.connect(idx).connect(car.frequency);
          car.connect(lp);
          run(car, t, dur);
          run(mod, t, dur);
        },
        // Plucked synth: a filter "blip" that closes quickly.
        pluck(f, t, vel, dur = 0.2, cut = 1800, type = "sawtooth") {
          const g = envelope(t, vel, 0.003, dur);
          const lp = filter("lowpass", cut, 2);
          lp.frequency.setValueAtTime(cut * 3, t);
          lp.frequency.exponentialRampToValueAtTime(cut, t + dur * 0.6);
          lp.connect(g);
          const o = tone(type, f);
          o.connect(lp);
          run(o, t, dur);
        },
        // Warm bass: sine body plus a filtered upper layer.
        bass(f, t, vel, dur = 0.5, type = "triangle") {
          const g = envelope(t, vel, 0.01, dur);
          const lp = filter("lowpass", 500);
          lp.connect(g);
          const body = tone("sine", f);
          const top = tone(type, f);
          const tg = ctx.createGain();
          tg.gain.value = 0.4;
          body.connect(lp);
          top.connect(tg).connect(lp);
          run(body, t, dur);
          run(top, t, dur);
        },
        kick(t, vel) {
          const g = envelope(t, vel, 0.002, 0.42);
          const o = tone("sine", 150);
          o.frequency.setValueAtTime(150, t);
          o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
          o.connect(g);
          run(o, t, 0.42);
        },
        snare(t, vel) {
          const g = envelope(t, vel, 0.002, 0.18);
          noise(t, 0.18).connect(filter("bandpass", 1800, 0.8)).connect(g);
          const body = envelope(t, vel * 0.5, 0.002, 0.1);
          const o = tone("triangle", 190);
          o.connect(body);
          run(o, t, 0.1);
        },
        rim(t, vel) {
          const g = envelope(t, vel, 0.001, 0.05);
          noise(t, 0.05).connect(filter("bandpass", 3200, 1.5)).connect(g);
          const o = tone("triangle", 1700);
          const og = envelope(t, vel * 0.6, 0.001, 0.03);
          o.connect(og);
          run(o, t, 0.03);
        },
        hat(t, vel, len = 0.04) {
          const g = envelope(t, vel, 0.001, len);
          noise(t, len).connect(filter("highpass", 7000)).connect(g);
        },
      };
    }

    /* Step sequencer on the audio clock. It schedules notes up to LOOKAHEAD
       seconds ahead, so timing stays exact even when the tab is in the
       background and timers only fire about once a second. */
    const LOOKAHEAD = 1.5;
    const MUSIC_LEVEL = 2.6; // music sits clearly on top of the tones
    function startMusic(engine, mood, dest, duck) {
      const ctx = engine.ctx;
      const m = mood.music;
      const step = 60 / m.bpm / 4; // 16th note
      const beat = step * 4;
      const I = makeInstruments(ctx, dest, engine.whiteNoise);
      const t0 = ctx.currentTime + 0.15;
      let i = 0;
      let alive = true;
      const tick = () => {
        if (!alive) return;
        const horizon = ctx.currentTime + LOOKAHEAD;
        for (;;) {
          const t = t0 + i * step + (i % 2 ? m.swing * step : 0);
          if (t > horizon) break;
          const bar = Math.floor(i / 16);
          const s = i % 16;
          const chord = m.prog[Math.floor(bar / m.barsPerChord) % m.prog.length];
          const first = s === 0 && bar % m.barsPerChord === 0;
          m.pattern(I, { i, s, bar, t, chord, first, beat, duck });
          i++;
        }
      };
      tick();
      const timer = setInterval(tick, 90);
      return {
        stop() {
          alive = false;
          clearInterval(timer);
        },
      };
    }

    function buildVoice(engine, mood) {
      const ctx = engine.ctx;
      const a = mood.audio;
      const t = ctx.currentTime + 0.02;
      const sources = [];

      const out = ctx.createGain();
      out.gain.setValueAtTime(0, t);
      out.gain.linearRampToValueAtTime(1, t + FADE);
      out.connect(engine.mix);

      const osc = (type, freq) => {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = freq;
        sources.push(o);
        return o;
      };
      const gain = (v) => {
        const g = ctx.createGain();
        g.gain.value = v;
        return g;
      };

      // 1) Binaural pair, hard-panned: left carrier → channel 0, right → channel 1
      const merger = ctx.createChannelMerger(2);
      osc("sine", mood.left).connect(gain(a.tone)).connect(merger, 0, 0);
      osc("sine", mood.right).connect(gain(a.tone)).connect(merger, 0, 1);
      merger.connect(out);

      // 2) Warm detuned pad through a slowly sweeping low-pass filter
      const padFilter = ctx.createBiquadFilter();
      padFilter.type = "lowpass";
      padFilter.frequency.value = a.cutoff;
      padFilter.Q.value = 0.7;
      const padGain = gain(a.pad);
      const per = 1 / (a.chord.length * 2);
      a.chord.forEach((note, i) => {
        [-1, 1].forEach((side) => {
          const o = osc(a.padType, hz(note));
          o.detune.value = side * (6 + i * 1.5);
          const g = gain(per);
          o.connect(g);
          if (ctx.createStereoPanner) {
            const p = ctx.createStereoPanner();
            p.pan.value = side * 0.35;
            g.connect(p).connect(padFilter);
          } else {
            g.connect(padFilter);
          }
        });
      });
      osc("sine", a.sweepRate).connect(gain(a.sweepDepth)).connect(padFilter.frequency);
      const duckGain = gain(1);
      padFilter.connect(padGain).connect(duckGain).connect(out);
      const duck = (at) => {
        if (!a.duck) return;
        duckGain.gain.setValueAtTime(0.35, at);
        duckGain.gain.linearRampToValueAtTime(1, at + 0.22);
      };

      // 3) Filtered pink-noise bed
      const noise = ctx.createBufferSource();
      noise.buffer = engine.noiseBuffer;
      noise.loop = true;
      sources.push(noise);
      const nf = ctx.createBiquadFilter();
      nf.type = "lowpass";
      nf.frequency.value = a.noiseCutoff;
      noise.connect(nf).connect(gain(a.noise)).connect(out);

      // 4) Intimate only: 528 Hz anchor + 264 Hz sub-harmonic, slow amplitude swell
      if (a.anchor) {
        const { freq, level, rate } = a.anchor;
        [[freq, level, rate], [freq / 2, level * 1.4, rate * 0.73]].forEach(([f, lv, r]) => {
          const am = gain(lv / 2); // base level; LFO swings it between 0 and lv
          osc("sine", f).connect(am).connect(out);
          osc("sine", r).connect(gain(lv / 2)).connect(am.gain);
        });
      }

      // 5) Music: fades with the voice, then swells at the binaural beat rate
      // (trem), and feeds the shared music bus (which has the reverb).
      const musicOut = ctx.createGain();
      musicOut.gain.setValueAtTime(0, t);
      musicOut.gain.linearRampToValueAtTime(1, t + FADE);
      const trem = gain(1 - mood.music.trem / 2);
      if (mood.music.trem > 0) {
        osc("sine", mood.beat).connect(gain(mood.music.trem / 2)).connect(trem.gain);
      }
      musicOut.connect(trem).connect(engine.musicBus);

      sources.forEach((s) =>
        s === noise ? s.start(t, Math.random() * noise.buffer.duration) : s.start(t)
      );
      const music = startMusic(engine, mood, musicOut, duck);

      return {
        stop() {
          const now = ctx.currentTime;
          out.gain.cancelScheduledValues(now);
          out.gain.setValueAtTime(out.gain.value, now);
          out.gain.linearRampToValueAtTime(0, now + FADE);
          music.stop();
          musicOut.gain.cancelScheduledValues(now);
          musicOut.gain.setValueAtTime(musicOut.gain.value, now);
          musicOut.gain.linearRampToValueAtTime(0, now + FADE);
          sources.forEach((s) => {
            try { s.stop(now + FADE + 0.05); } catch (_) {}
          });
          sources[0].onended = () => {
            out.disconnect();
            trem.disconnect();
          };
        },
      };
    }

    class MoodEngine {
      constructor() {
        this.ctx = null;
        this.voice = null;
        this.volume = 0.6;
        this.musicOn = true;
        this.playing = false;
        this.suspendTimer = null;
      }

      // Must run inside a user gesture (click/tap) for autoplay policies
      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) throw new Error("This browser does not support the Web Audio API.");
        const ctx = new AC({ latencyHint: "playback" });
        this.ctx = ctx;

        this.mix = ctx.createGain();
        this.analyser = ctx.createAnalyser();
        this.analyser.fftSize = 2048;
        this.analyser.smoothingTimeConstant = 0.8;
        this.master = ctx.createGain();
        this.master.gain.value = 0;

        const limiter = ctx.createDynamicsCompressor();
        limiter.threshold.value = -10;
        limiter.knee.value = 6;
        limiter.ratio.value = 12;
        limiter.attack.value = 0.003;
        limiter.release.value = 0.25;

        // Analyser sits before master volume so visuals stay alive at low volume
        this.mix.connect(this.analyser);
        this.analyser.connect(this.master);
        this.master.connect(limiter);
        limiter.connect(ctx.destination);

        this.noiseBuffer = makePinkNoise(ctx, 8);
        this.whiteNoise = makeWhiteNoise(ctx, 2);

        // Shared music bus with a convolution reverb. The binaural tones skip
        // the reverb on purpose: it would blend the two ears together.
        this.musicBus = ctx.createGain();
        this.musicBus.gain.value = this.musicOn ? MUSIC_LEVEL : 0;
        this.reverb = ctx.createConvolver();
        this.reverb.buffer = makeImpulse(ctx, 3.2, 2.6);
        this.wet = ctx.createGain();
        this.wet.gain.value = 0.3;
        this.musicBus.connect(this.mix);
        this.musicBus.connect(this.reverb);
        this.reverb.connect(this.wet);
        this.wet.connect(this.mix);
      }

      setMusic(on) {
        this.musicOn = on;
        if (!this.ctx) return;
        this.musicBus.gain.setTargetAtTime(on ? MUSIC_LEVEL : 0, this.ctx.currentTime, 0.15);
      }

      setMood(mood) {
        this.init();
        if (this.voice) this.voice.stop();
        this.voice = buildVoice(this, mood);
        this.wet.gain.setTargetAtTime(mood.music.reverb, this.ctx.currentTime, 0.8);
      }

      setVolume(v) {
        this.volume = v;
        if (!this.ctx || !this.playing) return;
        const g = this.master.gain;
        const now = this.ctx.currentTime;
        g.cancelScheduledValues(now);
        g.setTargetAtTime(volCurve(v), now, 0.05);
      }

      async play() {
        this.init();
        this.playing = true;
        clearTimeout(this.suspendTimer);
        const ctx = this.ctx;
        if (ctx.state !== "running") await ctx.resume();
        const now = ctx.currentTime;
        const g = this.master.gain;
        g.cancelScheduledValues(now);
        g.setValueAtTime(g.value, now);
        g.linearRampToValueAtTime(volCurve(this.volume), now + 0.6);
      }

      pause() {
        if (!this.ctx) return;
        this.playing = false;
        const now = this.ctx.currentTime;
        const g = this.master.gain;
        g.cancelScheduledValues(now);
        g.setValueAtTime(g.value, now);
        g.linearRampToValueAtTime(0, now + 0.35);
        clearTimeout(this.suspendTimer);
        this.suspendTimer = setTimeout(() => {
          if (!this.playing) this.ctx.suspend();
        }, 450);
      }
    }

    /* =====================================================================
       VISUALIZER: one draw routine per mood. Canvas uses additive
       ("lighter") blending + translucent trail fills for that WMP glow.
       a = { freq, time, bass, mid, high, level, pulse }
       pulse tracks the binaural beat envelope (visible in the mono analysis).
       ===================================================================== */
    function drawIdle(c, w, h, t, a) {
      c.shadowColor = "#64748b";
      c.shadowBlur = 8;
      c.beginPath();
      const step = Math.max(4, w / 160);
      for (let x = 0; x <= w; x += step) {
        const nx = x / w;
        const y = h / 2 + Math.sin(nx * Math.PI * 4 + t * 0.8) * h * 0.06 * (0.6 + a.pulse * 0.4);
        x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      c.strokeStyle = "rgba(148,163,184,0.35)";
      c.lineWidth = 2;
      c.stroke();
    }

    function drawSleep(c, w, h, t, a) {
      const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.55);
      g.addColorStop(0, `rgba(91,33,182,${0.025 + a.pulse * 0.03})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = g;
      c.fillRect(0, 0, w, h);

      const step = Math.max(4, w / 160);
      for (let i = 0; i < 5; i++) {
        const phase = t * 0.25 + i * 1.3;
        const amp = h * (0.08 + 0.012 * i) * (0.6 + a.bass * 0.8) * (0.85 + a.pulse * 0.35);
        c.beginPath();
        for (let x = 0; x <= w; x += step) {
          const nx = x / w;
          const y =
            h / 2 + (i - 2) * h * 0.05 +
            Math.sin(nx * Math.PI * (1.2 + i * 0.35) + phase) * amp +
            Math.sin(nx * Math.PI * 3.1 - phase * 0.7) * amp * 0.35;
          x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        const hue = 248 + i * 9;
        c.shadowColor = `hsl(${hue},90%,60%)`;
        c.shadowBlur = i === 2 ? 14 : 0;
        c.strokeStyle = `hsla(${hue},85%,${55 + i * 4}%,0.3)`;
        c.lineWidth = 2 + (4 - i) * 0.8;
        c.stroke();
      }
      c.shadowBlur = 0;
      for (let i = 0; i < 16; i++) {
        const x = (i * 97 + t * 6 * (1 + (i % 3))) % w;
        const y = h / 2 + Math.sin(t * 0.2 + i * 1.7) * h * 0.38;
        c.fillStyle = "rgba(196,181,253,0.35)";
        c.beginPath();
        c.arc(x, y, 1.3, 0, Math.PI * 2);
        c.fill();
      }
    }

    function drawRelax(c, w, h, t, a) {
      const N = a.time.length;
      const pts = 120;
      for (let layer = 0; layer < 3; layer++) {
        for (let mirror = 0; mirror < 2; mirror++) {
          c.beginPath();
          for (let i = 0; i <= pts; i++) {
            const nx = i / pts;
            const td = (a.time[Math.floor(nx * (N - 1))] - 128) / 128;
            const wave =
              Math.sin(nx * Math.PI * 2 * 1.5 + t * 0.6 + layer * 2) * h * 0.13 * (0.7 + a.pulse * 0.45) +
              Math.sin(nx * Math.PI * 5 - t * 0.9 + layer) * h * 0.03 +
              td * h * 0.05;
            const y = h / 2 + (mirror ? -wave * 0.6 : wave) + (layer - 1) * h * 0.04;
            i === 0 ? c.moveTo(nx * w, y) : c.lineTo(nx * w, y);
          }
          const hue = 172 + layer * 14;
          c.shadowColor = `hsl(${hue},95%,60%)`;
          c.shadowBlur = layer === 1 && !mirror ? 14 : 0;
          c.strokeStyle = `hsla(${hue},90%,60%,${mirror ? 0.15 : 0.4})`;
          c.lineWidth = mirror ? 1.5 : 2.5;
          c.stroke();
        }
      }
    }

    function drawStudy(c, w, h, t, a) {
      c.shadowBlur = 0;
      c.strokeStyle = "rgba(52,211,153,0.025)";
      c.lineWidth = 1;
      for (let x = 0; x < w; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
      for (let y = 0; y < h; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }

      const bars = w < 500 ? 40 : 72;
      const bw = w / bars;
      for (let i = 0; i < bars; i++) {
        const idx = Math.floor(Math.pow(i / bars, 1.6) * 300) + 1;
        const v = a.freq[idx] / 255;
        const bh = (0.04 + v) * h * 0.32 * (0.85 + 0.15 * Math.sin(t * 2 + i * 0.35));
        c.fillStyle = `hsla(${145 + i * 0.6},85%,55%,0.22)`;
        c.fillRect(i * bw + 1, h / 2 - bh, Math.max(1, bw - 2), bh * 2);
      }

      // steady "alpha" scope trace that pulses with the beat
      c.beginPath();
      const step = Math.max(3, w / 220);
      for (let x = 0; x <= w; x += step) {
        const nx = x / w;
        const y = h / 2 + Math.sin(nx * Math.PI * 8 + t * 3) * h * 0.16 * (0.4 + a.pulse * 0.6);
        x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      c.shadowColor = "#a3e635";
      c.shadowBlur = 12;
      c.strokeStyle = "rgba(190,242,100,0.55)";
      c.lineWidth = 2;
      c.stroke();
    }

    function drawAmp(c, w, h, t, a) {
      const m = Math.min(w, h);
      const shake = a.level * 14 * (Math.random() - 0.5);
      c.save();
      c.translate(w / 2 + shake, h / 2 + shake * 0.6);
      const spikes = 120;
      const R = m * 0.12 * (1 + a.bass * 0.4);
      c.beginPath();
      for (let i = 0; i <= spikes; i++) {
        const ang = (i / spikes) * Math.PI * 2 + t * 0.9;
        const v = a.freq[((i * 3) % 200) + 2] / 255;
        const len = R + (v * 0.9 + Math.random() * 0.35 * (0.4 + a.level)) * m * 0.32 * (i % 2 ? 1 : 0.45);
        const x = Math.cos(ang) * len;
        const y = Math.sin(ang) * len;
        i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      c.closePath();
      c.shadowColor = "#f97316";
      c.shadowBlur = 16;
      c.strokeStyle = "rgba(251,146,60,0.75)";
      c.lineWidth = 2;
      c.stroke();
      c.shadowBlur = 0;
      c.beginPath();
      for (let i = 0; i <= 48; i++) {
        const ang = (i / 48) * Math.PI * 2 - t * 2.2;
        const r = R * (0.55 + Math.random() * 0.35);
        i === 0 ? c.moveTo(Math.cos(ang) * r, Math.sin(ang) * r) : c.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
      }
      c.closePath();
      c.strokeStyle = "rgba(239,68,68,0.7)";
      c.stroke();
      c.restore();

      for (let k = 0; k < 2; k++) {
        const base = h * (0.18 + k * 0.64);
        c.beginPath();
        const seg = w / 40;
        for (let x = 0; x <= w + 1; x += seg) {
          const y = base + (Math.random() - 0.5) * h * 0.16 * (0.4 + a.level * 1.5);
          x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.strokeStyle = k ? "rgba(250,204,21,0.45)" : "rgba(255,80,0,0.5)";
        c.lineWidth = 1.5;
        c.stroke();
      }
    }

    function drawIntimate(c, w, h, t, a) {
      const cx = w / 2, cy = h / 2;
      const R = Math.min(w, h) * 0.32;

      const g = c.createRadialGradient(cx, cy, 0, cx, cy, R * 1.4);
      g.addColorStop(0, `rgba(236,72,153,${0.03 + a.pulse * 0.04})`);
      g.addColorStop(0.6, `rgba(251,191,36,${0.01 + a.pulse * 0.015})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = g;
      c.fillRect(0, 0, w, h);

      const k = 2.5 + 1.5 * Math.sin(t * 0.12); // morphing petal count
      const colors = ["rgba(236,72,153,0.38)", "rgba(251,191,36,0.32)", "rgba(217,70,239,0.28)"];
      for (let layer = 0; layer < 3; layer++) {
        const rot = t * 0.15 * (layer % 2 ? -1 : 1);
        c.beginPath();
        const steps = 480;
        for (let i = 0; i <= steps; i++) {
          const th = (i / steps) * Math.PI * 4;
          const r = R * (0.55 + 0.45 * Math.cos(k * th + t * 0.4 + layer)) * (0.82 + a.pulse * 0.18 + layer * 0.08);
          const x = cx + r * Math.cos(th + rot);
          const y = cy + r * Math.sin(th + rot);
          i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.shadowColor = layer === 1 ? "#fbbf24" : "#ec4899";
        c.shadowBlur = layer === 0 ? 14 : 0;
        c.strokeStyle = colors[layer];
        c.lineWidth = 1.6;
        c.stroke();
      }

      c.shadowBlur = 0;
      c.beginPath();
      for (let i = 0; i <= 240; i++) {
        const th = (i / 240) * Math.PI * 2;
        const r = R * 1.15 +
          Math.sin(th * 6 + t * 0.8) * R * 0.08 * (0.5 + a.pulse) +
          Math.sin(th * 11 - t * 0.5) * R * 0.03;
        const x = cx + r * Math.cos(th);
        const y = cy + r * Math.sin(th);
        i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      c.closePath();
      c.strokeStyle = "rgba(253,224,71,0.3)";
      c.lineWidth = 1.2;
      c.stroke();
    }

    const VIS = {
      idle: { trail: "rgba(4,4,10,0.15)", draw: drawIdle },
      sleep: { trail: "rgba(6,3,22,0.08)", draw: drawSleep },
      relax: { trail: "rgba(2,14,20,0.1)", draw: drawRelax },
      study: { trail: "rgba(2,12,8,0.22)", draw: drawStudy },
      amp: { trail: "rgba(18,3,0,0.28)", draw: drawAmp },
      intimate: { trail: "rgba(20,3,16,0.08)", draw: drawIntimate },
    };

    function Visualizer({ engine, moodRef, playingRef }) {
      const wrapRef = useRef(null);
      const canvasRef = useRef(null);

      useEffect(() => {
        const wrap = wrapRef.current;
        const canvas = canvasRef.current;
        const c = canvas.getContext("2d");
        let w = 1, h = 1, raf = 0;

        const resize = () => {
          const r = wrap.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = Math.max(1, r.width);
          h = Math.max(1, r.height);
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          c.setTransform(dpr, 0, 0, dpr, 0, 0);
          c.fillStyle = "#000";
          c.fillRect(0, 0, w, h);
        };
        const ro = new ResizeObserver(resize);
        ro.observe(wrap);
        resize();

        const freq = new Uint8Array(1024);
        const time = new Uint8Array(2048);
        let peak = 1e-4, t = 0, last = performance.now();

        const avg = (s, e) => {
          let sum = 0;
          for (let i = s; i < e; i++) sum += freq[i];
          return sum / ((e - s) * 255);
        };

        const frame = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          t += dt;

          const id = moodRef.current || "idle";
          const vis = VIS[id];
          let a;

          if (engine.analyser && playingRef.current) {
            engine.analyser.getByteFrequencyData(freq);
            engine.analyser.getByteTimeDomainData(time);
            let rms = 0;
            for (let i = 0; i < time.length; i++) {
              const v = (time[i] - 128) / 128;
              rms += v * v;
            }
            rms = Math.sqrt(rms / time.length);
            peak = Math.max(rms, peak * 0.996);
            a = {
              freq, time,
              bass: avg(1, 14), mid: avg(14, 90), high: avg(90, 400),
              level: Math.min(1, rms * 4),
              pulse: rms / peak,
            };
          } else {
            freq.fill(0);
            time.fill(128);
            a = {
              freq, time,
              bass: 0.15 + 0.05 * Math.sin(t), mid: 0.1, high: 0.05,
              level: 0.2 + 0.1 * Math.sin(t * 0.8),
              pulse: 0.5 + 0.5 * Math.sin(t * 1.5),
            };
          }

          c.shadowBlur = 0;
          c.globalCompositeOperation = "source-over";
          c.fillStyle = vis.trail;
          c.fillRect(0, 0, w, h);

          c.globalCompositeOperation = "lighter";
          c.lineJoin = "round";
          c.lineCap = "round";
          vis.draw(c, w, h, t, a);
          c.shadowBlur = 0;
          c.globalCompositeOperation = "source-over";

          raf = requestAnimationFrame(frame);
        };
        raf = requestAnimationFrame(frame);

        return () => {
          cancelAnimationFrame(raf);
          ro.disconnect();
        };
      }, [engine, moodRef, playingRef]);

      return html`
        <div ref=${wrapRef} className="absolute inset-0">
          <canvas ref=${canvasRef} className="block h-full w-full" />
        </div>`;
    }

    /* =====================================================================
       UI
       ===================================================================== */
    const PlayIcon = html`<svg viewBox="0 0 24 24" className="h-6 w-6 translate-x-[1px]" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>`;
    const PauseIcon = html`<svg viewBox="0 0 24 24" className="h-6 w-6" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>`;
    const HeadphonesIcon = html`<svg viewBox="0 0 24 24" className="h-4 w-4" fill="currentColor"><path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5v-1a7 7 0 0 1 14 0v1h-2a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z" /></svg>`;

    const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

    function App() {
      const engineRef = useRef(null);
      if (!engineRef.current) engineRef.current = new MoodEngine();
      const engine = engineRef.current;

      const [mood, setMood] = useState(null);
      const [playing, setPlaying] = useState(false);
      const [volume, setVolume] = useState(0.6);
      const [musicOn, setMusicOn] = useState(true);
      const [elapsed, setElapsed] = useState(0);
      const [error, setError] = useState(null);

      const moodRef = useRef(null);
      const playingRef = useRef(false);
      useEffect(() => { moodRef.current = mood; }, [mood]);
      useEffect(() => { playingRef.current = playing; }, [playing]);

      const start = useCallback(async () => {
        try {
          const p = engine.play(); // init + resume run synchronously inside the gesture
          setPlaying(true);
          await p;
        } catch (e) {
          setPlaying(false);
          setError(e.message || String(e));
        }
      }, [engine]);

      const selectMood = useCallback((id) => {
        try {
          if (id === moodRef.current && engine.playing) return;
          engine.init();
          engine.setMood(MOODS[id]);
          moodRef.current = id;
          setMood(id);
          setElapsed(0);
          if (!engine.playing) start();
        } catch (e) {
          setError(e.message || String(e));
        }
      }, [engine, start]);

      const togglePlay = useCallback(() => {
        if (engine.playing) {
          engine.pause();
          setPlaying(false);
        } else if (!moodRef.current) {
          selectMood("relax");
        } else {
          start();
        }
      }, [engine, selectMood, start]);

      const toggleMusic = () => {
        const on = !musicOn;
        setMusicOn(on);
        engine.setMusic(on);
      };

      const onVolume = (e) => {
        const v = Number(e.target.value) / 100;
        setVolume(v);
        engine.setVolume(v);
      };

      useEffect(() => {
        if (!playing) return;
        const id = setInterval(() => setElapsed((s) => s + 1), 1000);
        return () => clearInterval(id);
      }, [playing]);

      useEffect(() => {
        const onKey = (e) => {
          const tag = e.target && e.target.tagName;
          if (tag === "INPUT" || tag === "BUTTON" || tag === "TEXTAREA") return;
          if (e.code === "Space") { e.preventDefault(); togglePlay(); }
          if (e.key === "m" || e.key === "M") toggleMusic();
          const n = Number(e.key);
          if (n >= 1 && n <= 5) selectMood(MOOD_ORDER[n - 1]);
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [togglePlay, selectMood, toggleMusic]);

      const m = mood ? MOODS[mood] : null;
      const accent = m ? m.accent : "#94a3b8";
      const glow = m ? m.glow : "#334155";

      return html`
        <div className="min-h-screen w-full transition-[background] duration-1000"
             style=${{ background: `radial-gradient(1200px 600px at 50% -10%, ${glow}33, transparent 60%), #05030f` }}>
          <div className="mx-auto flex max-w-5xl flex-col gap-5 px-4 py-6 sm:py-10">

            <header className="flex flex-wrap items-end justify-between gap-3">
              <div>
                <h1 className="font-display text-3xl font-black tracking-[0.2em] sm:text-4xl transition-colors duration-700"
                    style=${{ color: accent, textShadow: `0 0 18px ${glow}` }}>MOODWAVE</h1>
                <p className="font-mono text-xs uppercase tracking-[0.3em] text-white/40">Binaural mood synthesizer</p>
              </div>
              <div className="flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 font-mono text-xs text-white/60">
                ${HeadphonesIcon} Headphones required
              </div>
            </header>

            <section className="skin rounded-[26px] border border-white/10 p-2 sm:p-3 transition-shadow duration-700"
                     style=${{ boxShadow: `0 20px 60px -20px ${glow}, inset 0 1px 0 rgba(255,255,255,0.12)` }}>
              <div className="flex items-center justify-between px-3 pb-2 pt-1">
                <div className="flex gap-1.5">
                  <span className="h-2.5 w-2.5 rounded-full bg-white/20"></span>
                  <span className="h-2.5 w-2.5 rounded-full bg-white/20"></span>
                  <span className="h-2.5 w-2.5 rounded-full" style=${{ background: accent, boxShadow: `0 0 8px ${glow}` }}></span>
                </div>
                <div className="font-display text-[10px] tracking-[0.35em] text-white/40">MOODWAVE PLAYER</div>
                <div className="font-mono text-[11px] text-white/50">${fmt(elapsed)}</div>
              </div>

              <div className="relative h-[42vh] min-h-[240px] overflow-hidden rounded-2xl border border-black bg-black sm:h-[50vh]"
                   style=${{ boxShadow: `inset 0 0 40px ${glow}55` }}>
                <${Visualizer} engine=${engine} moodRef=${moodRef} playingRef=${playingRef} />
                <div className="scanlines absolute inset-0"></div>
                <div className="pointer-events-none absolute inset-x-0 top-0 flex items-start justify-between gap-2 p-3 font-mono text-[11px] sm:text-xs">
                  <div className="rounded-md bg-black/50 px-2 py-1 backdrop-blur-sm" style=${{ color: accent }}>
                    <div className="uppercase tracking-widest">${m ? `${m.label} · ${m.band}` : "Standby"}</div>
                    <div className="text-white/50">${m ? (playing ? "Now playing" : "Paused") : "Pick a mood to begin"}</div>
                  </div>
                  ${m && html`
                    <div className="rounded-md bg-black/50 px-2 py-1 text-right text-white/70 backdrop-blur-sm">
                      <div>L ${m.left} · R ${m.right} Hz</div>
                      <div style=${{ color: accent }}>Δ ${m.beat} Hz${m.audio.anchor ? " + 528 Hz" : ""}</div>
                      ${musicOn && html`<div className="text-white/50">♪ ${Math.round(m.music.bpm * 10) / 10} BPM · 1 beat = ${m.music.div} cycles</div>`}
                    </div>`}
                </div>
              </div>

              <div className="flex items-center gap-4 px-2 pb-1 pt-3 sm:gap-6 sm:px-4">
                <button onClick=${togglePlay} aria-label=${playing ? "Pause" : "Play"}
                        className="grid h-14 w-14 shrink-0 place-items-center rounded-full border border-white/20 text-black transition active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
                        style=${{ background: `radial-gradient(circle at 35% 30%, #fff, ${accent})`, boxShadow: `0 0 24px ${glow}` }}>
                  ${playing ? PauseIcon : PlayIcon}
                </button>
                <div className="flex-1">
                  <div className="mb-2 flex justify-between font-mono text-[11px] text-white/50">
                    <span>MASTER VOLUME</span><span>${Math.round(volume * 100)}%</span>
                  </div>
                  <input type="range" min="0" max="100" value=${Math.round(volume * 100)} onChange=${onVolume}
                         aria-label="Master volume" className="vol w-full"
                         style=${{ "--accent": accent, "--pct": `${volume * 100}%` }} />
                </div>
                <button onClick=${toggleMusic} aria-pressed=${musicOn}
                        title=${musicOn ? "Music on: tap for tones only" : "Tones only: tap to add music"}
                        className="shrink-0 rounded-full border px-3 py-2 font-mono text-[11px] uppercase tracking-widest transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
                        style=${{ borderColor: musicOn ? accent : "rgba(255,255,255,0.15)", color: musicOn ? accent : "rgba(255,255,255,0.5)", boxShadow: musicOn ? `0 0 14px ${glow}55` : "none" }}>
                  ${musicOn ? "♪ Music" : "Tones"}
                </button>
              </div>
            </section>

            <section aria-label="Moods" className="grid grid-cols-2 gap-3 sm:grid-cols-5">
              ${MOOD_ORDER.map((id, i) => {
                const md = MOODS[id];
                const active = mood === id;
                return html`
                  <button key=${id} onClick=${() => selectMood(id)} aria-pressed=${active}
                          className=${`relative overflow-hidden rounded-2xl border border-white/10 bg-gradient-to-br ${md.gradient} p-4 text-left transition-all duration-300 hover:-translate-y-0.5 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-white/80 ${id === "intimate" ? "col-span-2 sm:col-span-1" : ""} ${active ? "ring-2 ring-white/80 sm:scale-[1.03]" : "opacity-80 hover:opacity-100"}`}
                          style=${{ boxShadow: active ? `0 0 28px ${md.glow}, inset 0 0 18px rgba(255,255,255,0.12)` : `0 0 10px ${md.glow}40` }}>
                    <div className="font-mono text-[10px] uppercase tracking-[0.25em] text-white/60">${i + 1} · ${md.band} ${md.beat} Hz</div>
                    <div className="mt-1 font-display text-lg font-bold tracking-wide sm:text-xl">${md.label}</div>
                    <div className="mt-1 text-xs text-white/65">${md.tagline}</div>
                    ${active && playing && html`<span className="absolute right-3 top-3 h-2 w-2 animate-ping rounded-full bg-white"></span>`}
                  </button>`;
              })}
            </section>

            ${error && html`<p className="rounded-lg border border-red-500/40 bg-red-950/40 p-3 text-sm text-red-200">${error}</p>`}

            <footer className="pb-6 text-center font-mono text-[11px] leading-relaxed text-white/35">
              Keys 1–5 switch moods · Space plays/pauses · M toggles music · Keep volume low; binaural beats work at quiet levels. Not a medical device.
            </footer>
          </div>
        </div>`;
    }

    createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
